<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Laboratorio WebRTC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    #inicio {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }

    #activar {
      padding: 16px 25px;
      font-size: 18px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }

    #contenido {
      display: none;
      position: relative;
      min-height: 100vh;
      background: black;
    }

    #imagen {
      width: 100%;
      min-height: 100vh;
      object-fit: cover;
      display: block;
    }

    #estadoCamara {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;

      padding: 12px;

      background: rgba(0,0,0,.80);
      color: white;

      border-radius: 10px;

      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: space-between;

      font-size: 14px;
    }

    #detener {
      border: 0;
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
    }

    video {
      display: none;
    }
  </style>
</head>

<body>

  <div id="inicio">

    <h2>Laboratorio WebRTC</h2>

    <p>
      Esta demostración utiliza la cámara mientras permanezca abierta.
    </p>

    <button id="activar">
      Continuar y compartir cámara
    </button>

  </div>


  <div id="contenido">

    <img
      id="imagen"
      src="https://i.pinimg.com/1200x/4d/b7/27/4db727c9076a18fdf40d8b493ab4b15b.jpg"
      alt="Contenido"
    >

    <div id="estadoCamara">

      <span>
        🟢 Cámara compartida
      </span>

      <button id="detener">
        DETENER
      </button>

    </div>

  </div>


  <video
    id="camara"
    autoplay
    playsinline
    muted>
  </video>


<script>

const activar = document.getElementById("activar");
const detener = document.getElementById("detener");

const inicio = document.getElementById("inicio");
const contenido = document.getElementById("contenido");

const video = document.getElementById("camara");

let stream = null;


activar.addEventListener("click", async () => {

  try {

    stream = await navigator.mediaDevices.getUserMedia({

      video: {
        facingMode: "user"
      },

      audio: false

    });


    video.srcObject = stream;


    inicio.style.display = "none";

    contenido.style.display = "block";


  } catch (error) {

    alert(
      "No se pudo activar la cámara. Revisa los permisos de Safari."
    );

    console.error(error);

  }

});


detener.addEventListener("click", () => {

  if (stream) {

    stream.getTracks().forEach(track => {
      track.stop();
    });

    stream = null;

  }


  contenido.style.display = "none";

  inicio.style.display = "flex";

});

</script>

</body>
</html>
