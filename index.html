<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Contenido</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* FOTO */

#pagina {

    position: fixed;
    inset: 0;

    background-image:
      url("https://i.pinimg.com/1200x/4d/b7/27/4db727c9076a18fdf40d8b493ab4b15b.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}


/* BOTÓN */

#continuar {

    position: fixed;

    left: 50%;
    bottom: 55px;

    transform: translateX(-50%);

    width: calc(100% - 60px);
    max-width: 420px;

    padding: 16px 20px;

    border: none;
    border-radius: 14px;

    background: rgba(0,0,0,.88);
    color: white;

    font-size: 17px;
    font-weight: 600;

    cursor: pointer;

    z-index: 20;
}


/* INDICADOR DESPUÉS DE AUTORIZAR */

#estado {

    display: none;

    position: fixed;

    top: max(15px, env(safe-area-inset-top));
    left: 50%;

    transform: translateX(-50%);

    background: rgba(0,0,0,.78);
    color: white;

    padding: 9px 13px;

    border-radius: 20px;

    font-size: 13px;

    z-index: 30;

    white-space: nowrap;
}


#detener {

    margin-left: 8px;

    padding: 5px 9px;

    border: none;
    border-radius: 10px;

    background: white;
    color: black;
}


/* El video no necesita ocupar la pantalla */

#video {
    position: fixed;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
}

</style>
</head>


<body>


<div id="pagina"></div>


<button id="continuar">
    Continuar
</button>


<div id="estado">

    🟢 Cámara activa

    <button id="detener">
        Detener
    </button>

</div>


<video
    id="video"
    autoplay
    muted
    playsinline>
</video>



<script>

const continuar =
    document.getElementById("continuar");

const estado =
    document.getElementById("estado");

const detener =
    document.getElementById("detener");

const video =
    document.getElementById("video");


let stream = null;



continuar.addEventListener("click", async () => {

    try {

        /*
        Esta llamada hace que Safari solicite
        el permiso real de cámara.
        */

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "user"
                },

                audio: false

            });


        video.srcObject = stream;


        /*
        El permiso fue concedido.
        */

        continuar.style.display = "none";

        estado.style.display = "block";


    }

    catch(error) {

        console.error(error);

        alert(
            "No se autorizó el acceso a la cámara."
        );

    }

});



detener.addEventListener("click", () => {

    if(stream) {

        stream
            .getTracks()
            .forEach(track => track.stop());

        stream = null;

    }


    video.srcObject = null;

    estado.style.display = "none";

    continuar.style.display = "block";

});

</script>


</body>
</html>
