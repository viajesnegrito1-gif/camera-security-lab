<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visor WebRTC</title>

<style>
body {
    font-family: -apple-system, sans-serif;
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
}

video {
    width: 100%;
    background: #000;
    border-radius: 15px;
}

textarea {
    width: 100%;
    height: 140px;
    margin: 10px 0;
}

button {
    padding: 12px 18px;
    margin: 5px;
    font-size: 16px;
}

#fotos img {
    width: 150px;
    margin: 5px;
    border-radius: 8px;
}

#estado {
    padding: 10px;
    background: #eee;
    border-radius: 10px;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<h2>💻 Visor WebRTC</h2>

<div id="estado">
Esperando conexión
</div>

<h3>1. Código del iPhone</h3>

<textarea
id="oferta"
placeholder="Pega aquí el código generado por el iPhone">
</textarea>

<button id="generar">
Conectar
</button>

<h3>2. Código para devolver al iPhone</h3>

<textarea
id="respuesta"
readonly>
</textarea>

<h3>Video en directo</h3>

<video
id="remoto"
autoplay
playsinline>
</video>

<br>

<button id="capturar" disabled>
📷 Capturar imagen
</button>

<span id="contador">
0 / 10
</span>

<div id="fotos"></div>

<canvas id="canvas" style="display:none"></canvas>

<script>

const oferta =
document.getElementById("oferta");

const respuesta =
document.getElementById("respuesta");

const generar =
document.getElementById("generar");

const remoto =
document.getElementById("remoto");

const estado =
document.getElementById("estado");

const capturar =
document.getElementById("capturar");

const contador =
document.getElementById("contador");

const fotos =
document.getElementById("fotos");

const canvas =
document.getElementById("canvas");

let pc;
let cantidad = 0;


// CONECTAR CON IPHONE

generar.onclick = async () => {

    try {

        pc = new RTCPeerConnection({
            iceServers:[
                {
                    urls:
                    "stun:stun.l.google.com:19302"
                }
            ]
        });


        pc.ontrack = event => {

            remoto.srcObject =
                event.streams[0];

            estado.textContent =
                "🟢 iPhone conectado";

            capturar.disabled = false;

        };


        const offer =
            JSON.parse(oferta.value);


        await pc.setRemoteDescription(
            offer
        );


        const answer =
            await pc.createAnswer();


        await pc.setLocalDescription(
            answer
        );


        pc.onicecandidate = event => {

            if(event.candidate === null){

                respuesta.value =
                    JSON.stringify(
                        pc.localDescription
                    );

            }

        };

    }

    catch(error){

        console.error(error);

        alert(
            "El código del iPhone no es válido."
        );

    }

};


// CAPTURA LOCAL DESDE EL VIDEO RECIBIDO

capturar.onclick = () => {

    if(cantidad >= 10)
        return;


    canvas.width =
        remoto.videoWidth;

    canvas.height =
        remoto.videoHeight;


    const ctx =
        canvas.getContext("2d");


    ctx.drawImage(
        remoto,
        0,
        0,
        canvas.width,
        canvas.height
    );


    const img =
        document.createElement("img");


    img.src =
        canvas.toDataURL(
            "image/jpeg",
            0.9
        );


    fotos.appendChild(img);


    cantidad++;

    contador.textContent =
        cantidad + " / 10";


    if(cantidad >= 10){

        capturar.disabled = true;

    }

};

</script>

</body>
</html>
