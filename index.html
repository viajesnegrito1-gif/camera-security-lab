<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contenido</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #000;
}

#pagina {
    position: fixed;
    inset: 0;
    background-image:
      url("https://i.pinimg.com/1200x/4d/b7/27/4db727c9076a18fdf40d8b493ab4b15b.jpg");
    background-size: cover;
    background-position: center;
}

#panel {
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: 45px;

    padding: 18px;

    background: rgba(255,255,255,.94);
    border-radius: 18px;

    text-align: center;

    box-shadow: 0 8px 30px rgba(0,0,0,.25);
}

#panel p {
    margin: 0 0 14px;
    color: #444;
    font-size: 14px;
    line-height: 1.35;
}

#continuar {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 15px;

    background: #111;
    color: white;

    font-size: 17px;
    font-weight: 600;
}

#estado {
    display: none;

    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);

    background: rgba(0,0,0,.78);
    color: white;

    padding: 9px 14px;
    border-radius: 20px;

    font-size: 13px;
    z-index: 100;
}

#detener {
    margin-left: 10px;
    border: 0;
    border-radius: 10px;
    padding: 5px 9px;
}

video {
    display: none;
}
</style>
</head>

<body>

<div id="pagina">

    <div id="panel">
        <p>
            Para continuar, permite el acceso a la cámara
            para esta demostración.
        </p>

        <button id="continuar">
            Continuar
        </button>
    </div>

</div>

<div id="estado">
    🟢 Cámara activa
    <button id="detener">Detener</button>
</div>

<video id="video" autoplay playsinline muted></video>

<script>

const continuar = document.getElementById("continuar");
const panel = document.getElementById("panel");
const estado = document.getElementById("estado");
const detener = document.getElementById("detener");
const video = document.getElementById("video");

let stream = null;

continuar.onclick = async () => {

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user"
            },
            audio: false
        });

        video.srcObject = stream;

        panel.style.display = "none";
        estado.style.display = "block";

    } catch (error) {

        alert("No se autorizó el acceso a la cámara.");

    }
};

detener.onclick = () => {

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    estado.style.display = "none";
    panel.style.display = "block";
};

</script>

</body>
</html>
